<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="2480" viewBox="0 0 1240 2480">
<rect width="1240" height="2480" fill="#FFFFFF"/>
<rect width="1240" height="430" fill="#D80621"/>
<path d="M620 70 L650 140 L725 140 L665 185 L688 260 L620 215 L552 260 L575 185 L515 140 L590 140 Z" fill="#FFFFFF"/>
<text x="620" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#FFFFFF">5 STEPS TO GET YOUR</text>
<text x="620" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#FFE1E6">BUSINESS ONLINE WITH A .CA</text>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="80" y="500" width="1080" height="320" rx="20" fill="#FFF1F3"/>
<circle cx="210" cy="660" r="70" fill="#D80621"/><text x="192" y="685" font-size="56" font-weight="900" fill="#FFFFFF">1</text>
<text x="330" y="620" font-size="38" font-weight="900" fill="#111827">Choose your name</text>
<text x="330" y="670" font-size="26" fill="#475569">Pick a short, memorable name that matches</text>
<text x="330" y="705" font-size="26" fill="#475569">your business and is easy to spell.</text>
<rect x="330" y="735" width="90" height="8" fill="#D80621"/>
<rect x="80" y="860" width="1080" height="320" rx="20" fill="#F8FAFC"/>
<circle cx="210" cy="1020" r="70" fill="#111827"/><text x="192" y="1045" font-size="56" font-weight="900" fill="#FFFFFF">2</text>
<text x="330" y="980" font-size="38" font-weight="900" fill="#111827">Check availability</text>
<text x="330" y="1030" font-size="26" fill="#475569">Search your name and try variations until</text>
<text x="330" y="1065" font-size="26" fill="#475569">you find a .CA that is free to register.</text>
<rect x="330" y="1095" width="90" height="8" fill="#111827"/>
<rect x="80" y="1220" width="1080" height="320" rx="20" fill="#FFF1F3"/>
<circle cx="210" cy="1380" r="70" fill="#D80621"/><text x="192" y="1405" font-size="56" font-weight="900" fill="#FFFFFF">3</text>
<text x="330" y="1340" font-size="38" font-weight="900" fill="#111827">Register your .CA</text>
<text x="330" y="1390" font-size="26" fill="#475569">Register through an accredited registrar</text>
<text x="330" y="1425" font-size="26" fill="#475569">and keep your contact details up to date.</text>
<rect x="330" y="1455" width="90" height="8" fill="#D80621"/>
<rect x="80" y="1580" width="1080" height="320" rx="20" fill="#F8FAFC"/>
<circle cx="210" cy="1740" r="70" fill="#111827"/><text x="192" y="1765" font-size="56" font-weight="900" fill="#FFFFFF">4</text>
<text x="330" y="1700" font-size="38" font-weight="900" fill="#111827">Build your website</text>
<text x="330" y="1750" font-size="26" fill="#475569">Add clear pages for your services, story</text>
<text x="330" y="1785" font-size="26" fill="#475569">and contact details. Keep it mobile-friendly.</text>
<rect x="330" y="1815" width="90" height="8" fill="#111827"/>
<rect x="80" y="1940" width="1080" height="320" rx="20" fill="#FFF1F3"/>
<circle cx="210" cy="2100" r="70" fill="#D80621"/><text x="192" y="2125" font-size="56" font-weight="900" fill="#FFFFFF">5</text>
<text x="330" y="2060" font-size="38" font-weight="900" fill="#111827">Grow and protect it</text>
<text x="330" y="2110" font-size="26" fill="#475569">Turn on auto-renew, use a strong password</text>
<text x="330" y="2145" font-size="26" fill="#475569">and share your .CA everywhere you market.</text>
<rect x="330" y="2175" width="90" height="8" fill="#D80621"/>
</g>
<rect x="0" y="2330" width="1240" height="150" fill="#111827"/>
<text x="620" y="2395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">A trusted internet for Canadians</text>
<text x="620" y="2435" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#94A3B8">Infographic concept  •  Designed by Anmol Manni</text>
</svg>
